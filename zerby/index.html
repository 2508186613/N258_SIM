<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ACS Zerby Simulation</title>

  <!-- Automatically open the PDF after one second -->
  <meta
    http-equiv="refresh"
    content="1; url=../ACS_Zerby_Simulation.pdf"
  >

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      color: #222;
    }

    .box {
      max-width: 500px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      background: #0969da;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>ACS Zerby Simulation</h1>
    <p>Opening the simulation PDF...</p>

    <p>
      <a href="../ACS_Zerby_Simulation.pdf">
        Open PDF
      </a>
    </p>
  </div>

  <script>
    window.setTimeout(function () {
      window.location.replace("../ACS_Zerby_Simulation.pdf");
    }, 1000);
  </script>
</body>
</html>
